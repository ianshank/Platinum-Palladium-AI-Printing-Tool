# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  api:
    # Production-specific configurations
    restart: always

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp

    # Production environment variables
    environment:
      - PTPD_API_HOST=0.0.0.0
      - PTPD_API_PORT=8000
      - PTPD_LOG_LEVEL=WARNING
      - PTPD_DATA_DIR=/app/data

    # Production volume mounts
    volumes:
      - ptpd-data:/app/data:rw
      # Optional: Mount config from host
      # - ./config.production.json:/app/config.json:ro

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
    restart: always
    profiles:
      - with-nginx

volumes:
  ptpd-data:
    driver: local
